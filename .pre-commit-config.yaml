# Pre-commit hooks for the Python backend (Ruff + Pyright).
# Install once (from repo root):  uv run --directory backend pre-commit install
# Run manually:                    ./scripts/ci/backend-lint.sh
# Or:                              uv run --directory backend pre-commit run --all-files
#
# Hooks use the backend venv so versions match uv.lock / pyproject.toml.
# pass_filenames is false so paths stay relative to backend/ (uv --directory).

repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/
        pass_filenames: false

      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/
        pass_filenames: false

      - id: pyright
        name: pyright
        entry: uv run --directory backend pyright
        language: system
        files: ^backend/
        types_or: [python, pyi]
        pass_filenames: false
