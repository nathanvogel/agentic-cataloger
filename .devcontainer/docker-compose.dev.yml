# Dev-only overrides: bind-mount the full repo for live edit (not used in CI/production).
# Use `.` not `..` — compose resolves relative paths from the project dir (repo root).
services:
  api:
    working_dir: /workspaces/pricecomp/backend
    volumes:
      - .:/workspaces/pricecomp
    # Image ENTRYPOINT is already `pricecomp`; devcontainer lifecycle wrapper appends it again.
    command: ["api"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://pricecomp_app:pricecomp_app_dev@postgres:5432/pricecomp_app
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/pricecomp_app
      PHOENIX_DATABASE_URL: postgresql://pricecomp_phoenix:pricecomp_phoenix_dev@postgres:5432/pricecomp_phoenix

  worker:
    working_dir: /workspaces/pricecomp/backend
    volumes:
      - .:/workspaces/pricecomp
    command: ["worker"]

  migrate:
    working_dir: /workspaces/pricecomp/backend
    volumes:
      - .:/workspaces/pricecomp
    command: ["migrate"]
