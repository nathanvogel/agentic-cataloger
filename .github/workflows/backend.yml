name: backend

on:
  push:
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".devcontainer/**"
      - "scripts/ci/backend-test.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".devcontainer/**"
      - "scripts/ci/backend-test.sh"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 3021:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Backend CI
        run: ./scripts/ci/backend-test.sh
