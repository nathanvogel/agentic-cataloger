name: backend

on:
  push:
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".devcontainer/**"
      - "scripts/ci/backend-test.sh"
      - "scripts/ci/backend-lint.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".devcontainer/**"
      - "scripts/ci/backend-test.sh"
      - "scripts/ci/backend-lint.sh"
      - ".pre-commit-config.yaml"
      - ".github/workflows/backend.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Backend lint
        run: ./scripts/ci/backend-lint.sh

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 3021:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Only the latest Lidl dump (~1 MB). Full data/ is ~177 MB and would
      # burn the free Git LFS bandwidth quota (~10 GiB/mo) across CI runs.
      - name: Fetch latest Lidl CSV via Git LFS
        run: |
          set -euo pipefail
          latest="$(find data/lidl-ch-products -type f -name '*.csv' | sort | tail -1)"
          if [ -z "${latest}" ]; then
            echo "No Lidl CSV paths found; integration sample test will skip."
            exit 0
          fi
          echo "Fetching ${latest}"
          git lfs pull --include="${latest}"

      - name: Backend CI
        run: ./scripts/ci/backend-test.sh
