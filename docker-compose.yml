version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: grocery-prices-db
    environment:
      POSTGRES_DB: grocery_prices
      POSTGRES_USER: grocery_user
      POSTGRES_PASSWORD: grocery_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery_user -d grocery_prices"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
