[project]
name = "pricecomp"
version = "0.1.0"
description = "Swiss grocery price comparison — Python monolith"
readme = "README.md"
requires-python = "==3.14.6"
dependencies = [
    # NFR17 runtime pins — lockfile is the compatibility authority (AD-27)
    "langgraph==1.2.10",
    "langgraph-checkpoint-postgres==3.1.1",
    "pgqueuer==1.3.2",
    "sqlalchemy[asyncio]==2.0.51",
    "alembic==1.18.5",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "fastapi==0.141.1",
    "fastmcp==3.4.5",
    "uvicorn==0.52.0",
    "langchain-core==1.5.3",
    "langchain-openai==1.4.1",
    "langchain-anthropic==1.5.3",
    "pydantic==2.13.4",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "openinference-instrumentation-langchain==0.1.68",
]

[project.scripts]
pricecomp = "pricecomp.platform.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pricecomp"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "testcontainers[postgres]==4.14.1",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests requiring disposable PostgreSQL",
    "proc: process-spawn role command tests",
]

[tool.coverage.run]
source = ["src/pricecomp"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.uv]
# Generate/sync this lockfile with uv 0.12.1 (AD-27 / GATE-01).
# Do not add LangGraph Server/CLI extras. Pydantic V2 only (no pydantic.v1 models).
